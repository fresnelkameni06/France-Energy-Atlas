name: Rebuild Excel analytics (three-day cycle)

on:
  workflow_dispatch:
  schedule:
    # Checks daily. The three-day guard below prevents more frequent rebuilds.
    - cron: "21 5 * * *"

permissions:
  contents: write

jobs:
  excel-refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Check three-day interval
        id: gate
        shell: bash
        run: |
          python - <<'PY'
          import datetime, os, pathlib
          stamp = pathlib.Path('.github/last_check_utc.txt')
          now = datetime.datetime.now(datetime.timezone.utc)
          elapsed = (now - datetime.datetime.fromisoformat(stamp.read_text().strip())).total_seconds() if stamp.exists() else 999999
          should = os.environ.get('GITHUB_EVENT_NAME') == 'workflow_dispatch' or elapsed >= 3 * 86400
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'run={str(should).lower()}\n')
          print('Three-day cycle due:', should)
          PY
      - name: Install analytical dependencies
        if: steps.gate.outputs.run == 'true'
        run: python -m pip install pandas pyarrow openpyxl numpy
      - name: Acquire the latest Excel workbook, without scraping RTE
        if: steps.gate.outputs.run == 'true'
        shell: bash
        env:
          EXCEL_SOURCE_URL: ${{ secrets.EXCEL_SOURCE_URL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p data
          if [ -n "$EXCEL_SOURCE_URL" ]; then
            python -m scripts.download_excel
          else
            # One-time prerequisite: create a GitHub Release with tag
            # excel-source and attach france_energy_2020_2026.xlsx.
            gh release download excel-source --pattern france_energy_2020_2026.xlsx --dir data --clobber
          fi
          test -s data/france_energy_2020_2026.xlsx
      - name: Validate and prepare analytics
        if: steps.gate.outputs.run == 'true'
        run: |
          python -m scripts.prepare_data
          python -m scripts.validate_data
          python -m unittest discover -s tests -v
      - name: Commit only prepared data (not the Excel workbook)
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          date -u +%Y-%m-%dT%H:%M:%S+00:00 > .github/last_check_utc.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/last_check_utc.txt data/processed
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh Excel-derived electricity analytics'
            git push
          fi
